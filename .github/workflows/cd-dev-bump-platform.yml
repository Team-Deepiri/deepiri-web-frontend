name: Deepiri CD - bump platform on dev

# When `dev` moves, propagate the new submodule SHA into deepiri-platform so the
# platform's cd-cloud-portal.yml rebuilds `platform-frontend` and redeploys to the
# VPS (platform.deepiri.com).
#
# This opens a PR against deepiri-platform:dev rather than pushing straight to it —
# matching the existing manual "bump-frontend-*" PR flow (deepiri-platform #345-#350).
# A human (or `gh pr merge --auto`, see below) merges it; the merge is what deploys.
#
# Required repo config (Settings > Secrets and variables > Actions):
#   Secret (secrets.*):
#     PLATFORM_REPO_TOKEN - PAT or GitHub App installation token with
#                           `contents: write` + `pull_requests: write` on
#                           Team-Deepiri/deepiri-platform. (Mirror of the
#                           PLATFORM_ACCESS_TOKEN secret already on the platform
#                           repo, opposite direction.) The default GITHUB_TOKEN
#                           cannot reach another repository.

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev-bump-platform
  cancel-in-progress: false

jobs:
  bump:
    name: Open submodule-bump PR on deepiri-platform
    runs-on: ubuntu-latest
    if: github.repository == 'Team-Deepiri/deepiri-web-frontend'
    steps:
      - name: Resolve frontend dev SHA
        id: fe
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout deepiri-platform (dev)
        uses: actions/checkout@v4
        with:
          repository: Team-Deepiri/deepiri-platform
          ref: dev
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          fetch-depth: 0
          submodules: false

      - name: Point deepiri-web-frontend gitlink at the new SHA
        id: bump
        env:
          FE_SHA: ${{ steps.fe.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse "HEAD:deepiri-web-frontend")"
          echo "platform currently pins deepiri-web-frontend @ $CURRENT"
          if [ "$CURRENT" = "$FE_SHA" ]; then
            echo "already up to date — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Update the gitlink without needing the submodule checked out.
          git update-index --cacheinfo 160000 "$FE_SHA" deepiri-web-frontend
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$FE_SHA" | cut -c1-9)" >> "$GITHUB_OUTPUT"

      - name: Commit, push branch, open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          FE_SHA: ${{ steps.fe.outputs.sha }}
          SHORT: ${{ steps.bump.outputs.short }}
        run: |
          set -euo pipefail
          BRANCH="ci/bump-frontend-${SHORT}"
          git config user.name  "deepiri-ci[bot]"
          git config user.email "deepiri-ci@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: bump deepiri-web-frontend to dev@${SHORT}" \
                     -m "Auto-generated by deepiri-web-frontend cd-dev-bump-platform.yml on push to dev.
          Frontend dev: https://github.com/Team-Deepiri/deepiri-web-frontend/commit/${FE_SHA}
          On merge, cd-cloud-portal.yml rebuilds platform-frontend and redeploys to the VPS."
          git push -f origin "$BRANCH"
          gh pr create \
            --repo Team-Deepiri/deepiri-platform \
            --base dev --head "$BRANCH" \
            --title "chore: bump deepiri-web-frontend to dev@${SHORT}" \
            --body "Automated submodule bump from \`deepiri-web-frontend@dev\` (\`${FE_SHA}\`).

          Merging redeploys \`platform-frontend\` to the VPS via \`cd-cloud-portal.yml\`.

          <!-- To make this fully hands-off, add \`gh pr merge --auto --squash\` here.
               Leaving it manual: every merge deploys straight to prod. -->" \
            || echo "PR may already exist for $BRANCH"
