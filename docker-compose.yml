version: "3.9"
services:
  hub-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "5200:5200"
    environment:
      - PORT=5200
      - NODE_ENV=production
      - REALTIME_GATEWAY_URL=ws://realtime-gateway:5008
      - API_GATEWAY_URL=http://api-gateway:5100
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks:
      - deepiri
  portal:
    build:
      context: .
      dockerfile: packages/portal/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - hub-server
    networks:
      - deepiri
  immersive:
    build:
      context: .
      dockerfile: packages/immersive/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - hub-server
    networks:
      - deepiri
networks:
  deepiri:
    external: true
