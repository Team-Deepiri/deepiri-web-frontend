# Deepiri Web Frontend — single container, single Vite app.
#
# Backends live in deepiri-platform (do not run hub-server here):
#   auth-service + api-gateway  → login / API
#   deepiri-registry            → service catalog + health
#   realtime-gateway            → live events
#   external-bridge             → GitHub webhooks → registry
#
# Prefer running via platform docker-compose.dev.yml (frontend-dev).
# This file is for optional local UI-only bring-up on the platform network.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:5100}
      VITE_REGISTRY_URL: ${VITE_REGISTRY_URL:-http://localhost:5003}
      VITE_REALTIME_GATEWAY_URL: ${VITE_REALTIME_GATEWAY_URL:-http://localhost:5008}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:turbo
    networks:
      - deepiri-dev-network

networks:
  deepiri-dev-network:
    external: true
    name: deepiri-dev-network
